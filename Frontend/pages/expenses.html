<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MABUMBATECH — Expenses</title>
<link rel="icon" href="../assets/logo-icon.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell" id="app-shell-mount"></div>

<script>window.FRONTEND_BASE = "../"; window.API_BASE = "../../Backend";</script>
<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script>
window.CURRENT_PAGE = 'expenses';
let CATEGORIES = [];
let PAYMENT_METHODS = [];

function pageContentHtml() {
  return `
    <div class="page-header">
      <div><h2>Expenses</h2><p>Rent, salaries, utilities, and everything else the business spends on.</p></div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" id="export-xlsx-btn">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="2.5" width="12" height="15" rx="1.4"/><path d="M7 7h2m2 0h2M7 10.5h2m2 0h2M7 14h2m2 0h2"/></svg>
          Excel
        </button>
        <button class="btn btn-secondary" id="export-pdf-btn">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="2.5" width="12" height="15" rx="1.4"/><path d="M7 7h6M7 10.5h6M7 14h3.5"/></svg>
          PDF
        </button>
        <button class="btn btn-primary" id="add-expense-btn">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
          Add Expense
        </button>
      </div>
    </div>

    <div class="hero-row" style="grid-template-columns:1fr 1fr;">
      <div class="hero-card"><div class="label">Total this period</div><div class="amount" id="stat-total">—</div><div class="delta" id="stat-count">—</div></div>
      <div class="stat-card"><div class="top-row"><div class="label">Top category</div></div><div class="amount" id="stat-top-cat" style="font-size:16px;">—</div></div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="var(--slate-muted)" stroke-width="1.7"><circle cx="9" cy="9" r="6"/><path d="M17 17l-4-4"/></svg>
          <input type="text" id="search-input" placeholder="Search by title, vendor…">
        </div>
        <select class="filter-select" id="filter-category"><option value="">All categories</option></select>
        <input type="date" class="filter-select" id="filter-start">
        <input type="date" class="filter-select" id="filter-end">
      </div>
      <div class="table-wrap" id="expenses-table-wrap"><div class="loading-row"><span class="spinner"></span> Loading…</div></div>
    </div>
  `;
}

async function loadCategories() {
  CATEGORIES = await api.get('api/categories.php', { kind: 'expense' });
  document.getElementById('filter-category').innerHTML = '<option value="">All categories</option>' + CATEGORIES.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
}

async function loadExpenses() {
  const wrap = document.getElementById('expenses-table-wrap');
  wrap.innerHTML = `<div class="loading-row"><span class="spinner"></span> Loading…</div>`;
  const query = {};
  const catId = document.getElementById('filter-category').value;
  if (catId) query.category_id = catId;
  const start = document.getElementById('filter-start').value;
  const end = document.getElementById('filter-end').value;
  if (start) query.start = start;
  if (end) query.end = end;

  try {
    let rows = await api.get('api/expenses.php', { ...query, limit: 300 });
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    if (q) rows = rows.filter(r => r.title.toLowerCase().includes(q) || (r.vendor || '').toLowerCase().includes(q));

    const total = rows.reduce((s, r) => s + Number(r.amount), 0);
    document.getElementById('stat-total').innerHTML = `${money(total)} <span>TZS</span>`;
    document.getElementById('stat-count').textContent = `${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}`;
    const byCat = {};
    rows.forEach(r => { const c = r.category_name || 'Uncategorised'; byCat[c] = (byCat[c] || 0) + Number(r.amount); });
    const topCat = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
    document.getElementById('stat-top-cat').textContent = topCat ? `${topCat[0]} (${money(topCat[1])} TZS)` : '—';

    if (!rows.length) { wrap.innerHTML = `<div class="empty-state"><div class="t">No expenses found</div><p>Try a different filter, or record your first expense.</p></div>`; return; }
    wrap.innerHTML = `
      <table>
        <thead><tr><th>Title</th><th>Category</th><th>Amount</th><th>Date</th><th>Vendor</th><th>Method</th><th>Actions</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
              <td class="pname">${escapeHtml(r.title)}</td>
              <td class="psub">${escapeHtml(r.category_name || '—')}</td>
              <td class="pname">${money(r.amount)}</td>
              <td class="psub">${fmtDate(r.expense_date)}</td>
              <td class="psub">${escapeHtml(r.vendor || '—')}</td>
              <td class="psub">${escapeHtml(r.payment_method_name || '—')}</td>
              <td style="white-space:nowrap;">
                <button class="btn-icon" title="Edit" onclick='editExpense(${r.id})'><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 3.5 16.5 6.5 7 16H4v-3l9.5-9.5Z"/></svg></button>
                <button class="btn-icon" title="Delete" onclick='deleteExpense(${r.id}, "${escapeHtml(r.title)}")'><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="var(--danger)" stroke-width="1.6"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg></button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch (e) {
    wrap.innerHTML = `<div class="empty-state"><div class="t">Could not load expenses</div><p>${escapeHtml(e.message)}</p></div>`;
  }
}

function expenseFormHtml(x = null) {
  const catOptions = CATEGORIES.map(c => `<option value="${c.id}" ${x && x.category_id === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
  const pmOptions = PAYMENT_METHODS.map(pm => `<option value="${pm.id}" ${x && x.payment_method_id === pm.id ? 'selected' : ''}>${escapeHtml(pm.name)}</option>`).join('');
  return `
    <div class="field"><label>Title</label><input type="text" id="f-title" value="${x ? escapeHtml(x.title) : ''}" required></div>
    <div class="field-row">
      <div class="field"><label>Category</label><select id="f-category"><option value="">— None —</option>${catOptions}</select></div>
      <div class="field"><label>Or type a new category</label><input type="text" id="f-category-new" placeholder="e.g. Fuel"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Amount (TZS)</label><input type="number" id="f-amount" min="0" value="${x ? x.amount : ''}" required></div>
      <div class="field"><label>Date</label><input type="date" id="f-date" value="${x ? x.expense_date : new Date().toISOString().slice(0,10)}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Payment method</label><select id="f-pm"><option value="">— None —</option>${pmOptions}</select></div>
      <div class="field"><label>Vendor / Paid to</label><input type="text" id="f-vendor" value="${x ? escapeHtml(x.vendor || '') : ''}"></div>
    </div>
    <div class="field"><label>Reference number (optional)</label><input type="text" id="f-ref" value="${x ? escapeHtml(x.reference_no || '') : ''}"></div>
    <div class="field"><label>Note</label><textarea id="f-note" rows="2">${x ? escapeHtml(x.note || '') : ''}</textarea></div>
  `;
}

function openExpenseModal(x = null) {
  const modal = openModal({
    title: x ? 'Edit Expense' : 'Add Expense',
    bodyHtml: expenseFormHtml(x),
    footHtml: `<button class="btn btn-secondary" id="cancel-btn">Cancel</button><button class="btn btn-primary" id="save-btn">${x ? 'Save changes' : 'Add Expense'}</button>`,
  });
  modal.querySelector('#cancel-btn').addEventListener('click', closeModal);
  modal.querySelector('#save-btn').addEventListener('click', () => saveExpense(x ? x.id : null));
}

async function saveExpense(id) {
  const payload = {
    title: document.getElementById('f-title').value.trim(),
    category_id: document.getElementById('f-category').value,
    category_name: document.getElementById('f-category-new').value.trim(),
    amount: document.getElementById('f-amount').value,
    expense_date: document.getElementById('f-date').value,
    payment_method_id: document.getElementById('f-pm').value,
    vendor: document.getElementById('f-vendor').value.trim(),
    reference_no: document.getElementById('f-ref').value.trim(),
    note: document.getElementById('f-note').value.trim(),
  };
  if (!payload.title || !payload.amount) { toast('Title and amount are required.', 'error'); return; }

  try {
    if (id) { payload.id = id; await api.put('api/expenses.php', payload); toast('Expense updated.', 'success'); }
    else { await api.post('api/expenses.php', payload); toast('Expense recorded.', 'success'); }
    closeModal();
    await loadCategories();
    loadExpenses();
  } catch (e) { toast(e.message, 'error'); }
}

async function editExpense(id) {
  try {
    const rows = await api.get('api/expenses.php', { limit: 500 });
    const x = rows.find(r => r.id === id);
    if (x) openExpenseModal(x);
  } catch (e) { toast(e.message, 'error'); }
}
async function deleteExpense(id, title) {
  const ok = await confirmDialog(`Delete expense "${title}"?`, { confirmLabel: 'Delete' });
  if (!ok) return;
  try { await api.del('api/expenses.php', { id }); toast('Expense removed.', 'success'); loadExpenses(); }
  catch (e) { toast(e.message, 'error'); }
}

let debounceTimer;
function debounceReload() { clearTimeout(debounceTimer); debounceTimer = setTimeout(loadExpenses, 300); }

initShell().then(async (user) => {
  if (!user) return;
  setPageTitle('Expenses');
  document.getElementById('page-content').innerHTML = pageContentHtml();

  document.getElementById('add-expense-btn').addEventListener('click', () => openExpenseModal());
  document.getElementById('export-xlsx-btn').addEventListener('click', () => exportAs('xlsx'));
  document.getElementById('export-pdf-btn').addEventListener('click', () => exportAs('pdf'));
  document.getElementById('search-input').addEventListener('input', debounceReload);
  document.getElementById('filter-category').addEventListener('change', loadExpenses);
  document.getElementById('filter-start').addEventListener('change', loadExpenses);
  document.getElementById('filter-end').addEventListener('change', loadExpenses);

  await loadCategories();
  try { PAYMENT_METHODS = await api.get('api/payment_methods.php', { status: 'active' }); } catch (e) {}
  loadExpenses();
});

function exportAs(format) {
  const params = { type: 'expenses', format };
  const start = document.getElementById('filter-start').value;
  const end = document.getElementById('filter-end').value;
  if (start) params.start = start;
  if (end) params.end = end;
  const qs = new URLSearchParams(params).toString();
  window.open(`../../Backend/api/export.php?${qs}`, '_blank');
}
</script>
</body>
</html>
