<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MABUMBATECH — My Profile</title>
<link rel="icon" href="../assets/logo-icon.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell" id="app-shell-mount"></div>

<script>window.FRONTEND_BASE = "../"; window.API_BASE = "../../Backend";</script>
<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script>
window.CURRENT_PAGE = 'profile';

function pageContentHtml(p) {
  return `
    <div class="page-header"><div><h2>My Profile</h2><p>Your account details and security settings.</p></div></div>

    <div class="table-row-section">
      <div class="panel">
        <div class="panel-head"><h3>Account details</h3></div>
        <div class="field"><label>Full name</label><input type="text" id="f-name" value="${escapeHtml(p.full_name)}"></div>
        <div class="field"><label>Username</label><input type="text" value="${escapeHtml(p.username)}" disabled></div>
        <div class="field"><label>Role</label><input type="text" value="${escapeHtml(p.role_name)}" disabled></div>
        <button class="btn btn-primary" id="save-name-btn">Save Name</button>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Change password</h3></div>
        <div class="field"><label>Current password</label><input type="password" id="f-current-pw"></div>
        <div class="field"><label>New password</label><input type="password" id="f-new-pw"></div>
        <button class="btn btn-primary" id="save-pw-btn">Update Password</button>

        <hr style="border:none; border-top:1px solid var(--border); margin:22px 0;">

        <div class="panel-head"><h3>Security question</h3></div>
        <p class="hint" style="margin-top:-6px;">Current: "${escapeHtml(p.security_question)}"</p>
        <div class="field"><label>Current password (to confirm)</label><input type="password" id="f-sq-pw"></div>
        <div class="field"><label>New security question</label><input type="text" id="f-new-sq"></div>
        <div class="field"><label>New answer</label><input type="text" id="f-new-sa"></div>
        <button class="btn btn-secondary" id="save-sq-btn">Update Security Question</button>
      </div>
    </div>
  `;
}

initShell().then(async (user) => {
  if (!user) return;
  setPageTitle('My Profile');
  const p = await api.get('api/profile.php');
  document.getElementById('page-content').innerHTML = pageContentHtml(p);

  document.getElementById('save-name-btn').addEventListener('click', async () => {
    try { await api.put('api/profile.php', { full_name: document.getElementById('f-name').value.trim() }); toast('Name updated.', 'success'); }
    catch (e) { toast(e.message, 'error'); }
  });

  document.getElementById('save-pw-btn').addEventListener('click', async () => {
    const current = document.getElementById('f-current-pw').value;
    const next = document.getElementById('f-new-pw').value;
    if (!current || !next) { toast('Fill in both password fields.', 'error'); return; }
    try {
      await api.put('api/profile.php', { current_password: current, new_password: next });
      toast('Password updated.', 'success');
      document.getElementById('f-current-pw').value = ''; document.getElementById('f-new-pw').value = '';
    } catch (e) { toast(e.message, 'error'); }
  });

  document.getElementById('save-sq-btn').addEventListener('click', async () => {
    const current = document.getElementById('f-sq-pw').value;
    const sq = document.getElementById('f-new-sq').value.trim();
    const sa = document.getElementById('f-new-sa').value.trim();
    if (!current || !sq || !sa) { toast('Fill in all security question fields.', 'error'); return; }
    try {
      await api.put('api/profile.php', { current_password: current, security_question: sq, security_answer: sa });
      toast('Security question updated.', 'success');
      document.getElementById('f-sq-pw').value = ''; document.getElementById('f-new-sq').value = ''; document.getElementById('f-new-sa').value = '';
    } catch (e) { toast(e.message, 'error'); }
  });
});
</script>
</body>
</html>
